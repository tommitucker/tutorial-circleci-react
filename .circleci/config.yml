version: 2.1

orbs:
  node: circleci/node@7.1.0

jobs:
  test-unit:
    parallelism: 4
    executor:
      name: node/default
      tag: '24.0'
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run Unit Tests
          command: |
            UNIT_FILES=$( (circleci tests glob "src/**/*.unit.test.ts"; circleci tests glob "src/**/*.unit.test.tsx") | circleci tests split --split-by=timings)
            if [ -n "$UNIT_FILES" ]; then
              echo "$UNIT_FILES" | xargs npx vitest run --reporter=junit --outputFile=test-results/unit-${CIRCLE_NODE_INDEX}.xml --passWithNoTests
            else
              npx vitest run --reporter=junit --outputFile=test-results/unit-${CIRCLE_NODE_INDEX}.xml --passWithNoTests
            fi
            
      - store_test_results:
          path: test-results


  test-integration:
    executor:
      name: node/default
      tag: '24.0'
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run Integration Tests
          command: npm run test:integration:ci

  build:
    executor:
      name: node/default
      tag: '24.0'
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build Application
          command: npm run build

  lint:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint

workflows:
  version: 2
  build-and-test:
    jobs:
      - test-integration
      - test-unit
      - build:
          requires:
            - test-integration
            - test-unit
